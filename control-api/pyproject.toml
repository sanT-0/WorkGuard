[project]
name = "workguard-control-api"
version = "1.1.0"
description = "WorkGuard endpoint policy orchestration control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "cryptography==45.0.7",
  "rfc8785==0.1.4",
  "PyJWT[crypto]==2.15.1",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["__pycache__", ".venv", "workguard.db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
