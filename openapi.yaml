components:
  schemas:
    AgentEnrollRequest:
      properties:
        enrollment_code:
          type: string
          maxLength: 128
          minLength: 8
          title: Enrollment Code
        device_public_key:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Device Public Key
        agent_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Agent Version
        os_version:
          type: string
          maxLength: 200
          minLength: 1
          title: Os Version
        os_edition:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Os Edition
          default: Windows 11 Enterprise
      type: object
      required:
      - enrollment_code
      - agent_version
      - os_version
      title: AgentEnrollRequest
    AgentEnrollResponse:
      properties:
        device_id:
          type: string
          title: Device Id
        device_token:
          type: string
          title: Device Token
        expires_at:
          type: string
          title: Expires At
      type: object
      required:
      - device_id
      - device_token
      - expires_at
      title: AgentEnrollResponse
    AgentEventsBatchRequest:
      properties:
        events:
          items:
            $ref: '#/components/schemas/SecurityEvent'
          type: array
          maxItems: 1000
          minItems: 1
          title: Events
      type: object
      required:
      - events
      title: AgentEventsBatchRequest
    AgentHeartbeatRequest:
      properties:
        agent_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Agent Version
        os_version:
          type: string
          maxLength: 200
          minLength: 1
          title: Os Version
        os_edition:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Os Edition
        current_policy_version:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Current Policy Version
        observed_at:
          type: string
          title: Observed At
        endpoint_protection_state:
          anyOf:
          - type: string
            enum:
            - active
            - inactive
            - unknown
            - unsupported
          - type: 'null'
          title: Endpoint Protection State
          default: unknown
      type: object
      required:
      - agent_version
      - os_version
      - observed_at
      title: AgentHeartbeatRequest
    AgentPolicyResultsRequest:
      properties:
        policy_version:
          type: integer
          minimum: 1.0
          title: Policy Version
        observed_at:
          type: string
          title: Observed At
        controls:
          items:
            $ref: '#/components/schemas/ControlResult'
          type: array
          maxItems: 50
          minItems: 1
          title: Controls
      type: object
      required:
      - policy_version
      - observed_at
      - controls
      title: AgentPolicyResultsRequest
    AgentReleaseCheckResponse:
      properties:
        update_available:
          type: boolean
          title: Update Available
        release_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Version
        artifact_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Url
        artifact_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Sha256
        signature_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature Base64
        mandatory:
          type: boolean
          title: Mandatory
          default: false
      type: object
      required:
      - update_available
      title: AgentReleaseCheckResponse
    AgentUpdatesCheckRequest:
      properties:
        current_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Current Version
        os_version:
          type: string
          maxLength: 200
          minLength: 1
          title: Os Version
        architecture:
          type: string
          enum:
          - x64
          - arm64
          title: Architecture
      type: object
      required:
      - current_version
      - os_version
      - architecture
      title: AgentUpdatesCheckRequest
    ApprovePolicyRequest:
      properties:
        approval_notes:
          type: string
          maxLength: 500
          minLength: 3
          title: Approval Notes
      type: object
      required:
      - approval_notes
      title: ApprovePolicyRequest
    ControlResult:
      properties:
        control_id:
          type: string
          title: Control Id
        status:
          type: string
          enum:
          - enforced
          - partial
          - failed
          - unsupported
          - not_configured
          - unknown
          title: Status
        provider:
          type: string
          title: Provider
        provider_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Version
        observed_at:
          type: string
          title: Observed At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        safe_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Safe Details
      type: object
      required:
      - control_id
      - status
      - provider
      - observed_at
      title: ControlResult
    CreateDraftPolicyRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        policy:
          $ref: '#/components/schemas/PolicyObject'
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - name
      - policy
      - reason
      title: CreateDraftPolicyRequest
    CreateEnrollmentCodeRequest:
      properties:
        expires_in_seconds:
          type: integer
          maximum: 600.0
          minimum: 60.0
          title: Expires In Seconds
          default: 300
        requested_for_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested For User Id
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - reason
      title: CreateEnrollmentCodeRequest
    CreateExceptionRequest:
      properties:
        device_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Device Id
        control_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Control Id
        reason:
          type: string
          maxLength: 500
          minLength: 5
          title: Reason
        expires_at:
          type: string
          title: Expires At
      type: object
      required:
      - device_id
      - control_id
      - reason
      - expires_at
      title: CreateExceptionRequest
    DeviceDetail:
      properties:
        id:
          type: string
          title: Id
        org_id:
          type: string
          title: Org Id
          default: org-default
        display_name:
          type: string
          title: Display Name
        assigned_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned User Id
        os_version:
          type: string
          title: Os Version
        os_edition:
          type: string
          title: Os Edition
          default: Windows 11 Enterprise
        agent_version:
          type: string
          title: Agent Version
        status:
          type: string
          enum:
          - enrolled
          - compliant
          - noncompliant
          - stale
          - revoked
          - unknown
          title: Status
        last_seen_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Seen At
        policy_version_desired:
          anyOf:
          - type: integer
          - type: 'null'
          title: Policy Version Desired
        policy_version_observed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Policy Version Observed
        last_applied_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Applied Version
        controls:
          items:
            $ref: '#/components/schemas/ControlResult'
          type: array
          title: Controls
        assigned_policy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned Policy Id
        compliance_details:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Compliance Details
      type: object
      required:
      - id
      - display_name
      - os_version
      - agent_version
      - status
      title: DeviceDetail
    EditDraftPolicyRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        policy:
          anyOf:
          - $ref: '#/components/schemas/PolicyObject'
          - type: 'null'
        reason:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 3
          - type: 'null'
          title: Reason
      type: object
      title: EditDraftPolicyRequest
    EnrollmentCodeResponse:
      properties:
        enrollment_code:
          type: string
          title: Enrollment Code
        expires_at:
          type: string
          title: Expires At
        requested_for_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested For User Id
      type: object
      required:
      - enrollment_code
      - expires_at
      title: EnrollmentCodeResponse
    ExceptionSummary:
      properties:
        id:
          type: string
          title: Id
        device_id:
          type: string
          title: Device Id
        control_id:
          type: string
          title: Control Id
        reason:
          type: string
          title: Reason
        status:
          type: string
          title: Status
        created_at:
          type: string
          title: Created At
        expires_at:
          type: string
          title: Expires At
        revoked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked At
        revoked_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked Reason
      type: object
      required:
      - id
      - device_id
      - control_id
      - reason
      - status
      - created_at
      - expires_at
      title: ExceptionSummary
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    PolicyControlItem:
      properties:
        control_id:
          type: string
          enum:
          - removable_storage
          - application_control
          - disk_encryption
          - endpoint_protection
          - endpoint_dlp
          - network_policy
          title: Control Id
        required:
          type: boolean
          title: Required
        settings:
          additionalProperties: true
          type: object
          title: Settings
      type: object
      required:
      - control_id
      - required
      - settings
      title: PolicyControlItem
    PolicyDetail:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        lifecycle_state:
          type: string
          enum:
          - draft
          - submitted
          - approved
          - published
          - retired
          title: Lifecycle State
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
        updated_at:
          type: string
          title: Updated At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
        published_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Published By
        policy:
          $ref: '#/components/schemas/PolicyObject'
        versions:
          items:
            $ref: '#/components/schemas/PolicyVersionSummary'
          type: array
          title: Versions
      type: object
      required:
      - id
      - name
      - lifecycle_state
      - updated_at
      - policy
      title: PolicyDetail
    PolicyObject:
