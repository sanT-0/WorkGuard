        schema_version:
          type: string
          const: 1.0.0
          title: Schema Version
          default: 1.0.0
        policy_id:
          type: string
          title: Policy Id
        policy_version:
          type: integer
          minimum: 1.0
          title: Policy Version
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
          default: ''
        rollout_mode:
          type: string
          enum:
          - audit
          - enforce
          title: Rollout Mode
          default: enforce
        controls:
          items:
            $ref: '#/components/schemas/PolicyControlItem'
          type: array
          title: Controls
      type: object
      required:
      - policy_id
      - policy_version
      - name
      - controls
      title: PolicyObject
    PolicySummary:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        lifecycle_state:
          type: string
          enum:
          - draft
          - submitted
          - approved
          - published
          - retired
          title: Lifecycle State
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
        updated_at:
          type: string
          title: Updated At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
        published_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Published By
      type: object
      required:
      - id
      - name
      - lifecycle_state
      - updated_at
      title: PolicySummary
    PolicyVersionSummary:
      properties:
        version:
          type: integer
          title: Version
        digest_sha256:
          type: string
          title: Digest Sha256
        key_id:
          type: string
          title: Key Id
        rollback_of_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rollback Of Version
        published_at:
          type: string
          title: Published At
        published_by:
          type: string
          title: Published By
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - version
      - digest_sha256
      - key_id
      - published_at
      - published_by
      title: PolicyVersionSummary
    PublishPolicyRequest:
      properties:
        version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Version
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
        rollout_group:
          anyOf:
          - type: string
          - type: 'null'
          title: Rollout Group
          default: all
      type: object
      required:
      - reason
      title: PublishPolicyRequest
    RevokeDeviceRequest:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - reason
      title: RevokeDeviceRequest
    RevokeExceptionRequest:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - reason
      title: RevokeExceptionRequest
    RollbackPolicyRequest:
      properties:
        target_version:
          type: integer
          minimum: 1.0
          title: Target Version
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - target_version
      - reason
      title: RollbackPolicyRequest
    RotateDeviceCredentialResponse:
      properties:
        device_id:
          type: string
          title: Device Id
        device_token:
          type: string
          title: Device Token
        issued_at:
          type: string
          title: Issued At
      type: object
      required:
      - device_id
      - device_token
      - issued_at
      title: RotateDeviceCredentialResponse
    SecurityEvent:
      properties:
        id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Id
        device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
        event_type:
          type: string
          maxLength: 120
          minLength: 1
          title: Event Type
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
          title: Severity
        occurred_at:
          type: string
          title: Occurred At
        source:
          type: string
          maxLength: 120
          minLength: 1
          title: Source
        response_state:
          type: string
          maxLength: 120
          minLength: 1
          title: Response State
      type: object
      required:
      - event_type
      - severity
      - occurred_at
      - source
      - response_state
      title: SecurityEvent
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token with a WorkGuard role claim.
    deviceBearer:
      type: http
      scheme: bearer
      description: Per-device token returned once by POST /agent/enroll.
    devHeaders:
      type: apiKey
      in: header
      name: X-Dev-User
      description: Local development identity. Requires APP_ENV=local, AUTH_MODE=dev and ALLOW_DEV_AUTH=1; also send X-Dev-Role.
servers:
- url: /api/v1
  description: Relative to the control-plane origin
x-workguard-implementation:
  status: local MVP
  windows_agent: not implemented; endpoint-agent/simulator.py is a verification harness
  real_dlp: not implemented
  signing: Ed25519 over RFC 8785 canonical envelopes, generated per device at fetch time
tags:
- name: Health
  description: Liveness and readiness probes.
- name: Admin Devices
  description: Device inventory, enrollment, revocation and credential rotation.
- name: Admin Policies
  description: Policy drafts, approval, publication and rollback.
- name: Admin Events
  description: Security events and the hash-chained admin audit trail.
- name: Admin Exceptions
  description: Scoped, expiring control exceptions.
- name: Agent
  description: Device enrollment, policy retrieval, results and events.
